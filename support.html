<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Broken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ef4444',
                        secondary: '#f43f5e',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-red-100">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <img src="https://aktlnldjuvrhrragkzbz.supabase.co/storage/v1/object/sign/brokenbucket/broken-final.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV85MzRlMGEwNS02Y2FkLTQ3MGEtYjQ1OC1kMGY3NmQ4NGYwMTAiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJicm9rZW5idWNrZXQvYnJva2VuLWZpbmFsLnBuZyIsImlhdCI6MTc2NDUyOTgzMCwiZXhwIjozNDk5MDA5ODMwfQ.WM39bFo9XFxSD80LoH4oVSWnxewEbsZs6hNFFO8UDAE" 
                     alt="Broken Logo" class="h-8 w-auto" />
                <span class="font-bold text-xl text-slate-900 hidden sm:block">Broken</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-red-600 transition-colors">Back to Home</a>
        </div>
    </nav>

    <!-- Content -->
    <main class="container mx-auto px-6 py-32 max-w-xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold mb-4 text-slate-900">How can we help?</h1>
            <p class="text-slate-600">We're here to help you on your healing journey. Send us a message and we'll get back to you as soon as possible.</p>
        </div>

        <form id="support-form" class="space-y-6 bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Name</label>
                <input type="text" id="name" name="name" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none transition-all">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none transition-all">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-slate-700 mb-2">Message</label>
                <textarea id="message" name="message" rows="4" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-100 outline-none transition-all"></textarea>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-4 bg-gradient-to-r from-red-600 to-rose-600 text-white font-medium rounded-xl shadow-lg shadow-red-500/20 hover:shadow-red-500/30 hover:scale-[1.02] transition-all">
                Send Message
            </button>
        </form>

        <div id="success-message" class="hidden mt-6 p-6 bg-green-50 text-green-800 rounded-2xl border border-green-200 text-center">
            <div class="flex justify-center mb-2">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="font-bold text-lg mb-1">Message Sent!</h3>
            <p>Thank you for reaching out. We'll get back to you shortly.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-slate-100 bg-white mt-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-slate-400 text-sm">© 2025 Broken App. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('support-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Mock submission
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            
            btn.disabled = true;
            btn.innerText = 'Sending...';

            setTimeout(() => {
                document.getElementById('support-form').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
            }, 1500);
        });
    </script>
</body>
</html>
