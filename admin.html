<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken - Waitlist Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <div class="bg-purple-100 p-3 rounded-xl">
                    <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Waitlist</h1>
                    <p class="text-slate-500">Monitor signups</p>
                </div>
            </div>
            <button onclick="fetchWaitlist()" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-700 text-sm font-medium transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50/50">
                <div class="font-semibold text-slate-700">Total Signups</div>
                <div id="count" class="text-2xl font-bold text-purple-600">0</div>
            </div>
            
            <div id="list-container" class="divide-y divide-slate-100">
                <div class="p-12 flex justify-center text-slate-400">
                    <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const projectId = "aktlnldjuvrhrragkzbz"; // Supabase Project ID
        
        async function fetchWaitlist() {
            const container = document.getElementById('list-container');
            const countEl = document.getElementById('count');
            
            container.innerHTML = '<div class="p-12 flex justify-center text-slate-400"><svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>';
            
            try {
                const response = await fetch(`https://${projectId}.supabase.co/functions/v1/make-server-bf0073c5/waitlist`);
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                const emails = data.emails || [];
                
                countEl.innerText = emails.length;
                
                if (emails.length === 0) {
                    container.innerHTML = '<div class="p-12 text-center text-slate-500">No signups yet.</div>';
                    return;
                }
                
                container.innerHTML = emails.map((email, i) => `
                    <div class="p-4 hover:bg-slate-50 transition-colors flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-medium text-slate-500">
                            ${i + 1}
                        </div>
                        <div class="text-slate-700 font-medium">${email}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="p-12 text-center text-red-500">Failed to load waitlist. Check console.</div>';
            }
        }

        // Load on start
        fetchWaitlist();
    </script>
</body>
</html>
